name: UniFi search

on:
  schedule:
    # Times are UTC. Budapest is UTC+1 in winter, UTC+2 in summer (runs are then one hour later).
    # GitHub starts scheduled jobs 40-55 min late, so each is set ~45 min before the target time.
    # Daytime runs (push notifications):
    - cron: "15 5 * * *"    # ~07:00 Budapest
    - cron: "15 9 * * *"    # ~11:00
    - cron: "15 12 * * *"   # ~14:00
    - cron: "15 15 * * *"   # ~17:00
    - cron: "15 18 * * *"   # ~20:00
    # Quiet overnight runs: HardverApró's newest-ads page covers only a few hours, so these
    # record overnight ads without a push (22:00-06:00); they are sent in the morning push.
    - cron: "15 21 * * *"   # ~22:00
    - cron: "15 0 * * *"    # ~01:00
    - cron: "15 3 * * *"    # ~04:00
  workflow_dispatch:   # "Run workflow" button for a manual search
    inputs:
      test_push:
        description: "Send a test push notification even if there are no new ads"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unifi-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search HardverApró
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          TEST_PUSH: ${{ inputs.test_push }}
          DAILY_SUMMARY: ${{ vars.DAILY_SUMMARY }}
        run: python scraper.py

      - name: Save the updated list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data LISTINGS.md docs
          git diff --cached --quiet && exit 0
          git commit -m "Update UniFi listings $(TZ=Europe/Budapest date '+%Y-%m-%d %H:%M')"
          # If someone pushed meanwhile (e.g. another run or a code change), rebase on top and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
