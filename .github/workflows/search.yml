name: UniFi search

on:
  schedule:
    # Times are UTC. 07:00 / 11:00 / 18:00 UTC = 08:00 / 12:00 / 19:00 in Budapest in winter
    # (09:00 / 13:00 / 20:00 in summer). GitHub may start scheduled runs a few minutes late.
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:   # "Run workflow" button for a manual search
    inputs:
      test_push:
        description: "Send a test push notification even if there are no new ads"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unifi-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search HardverApró + Jófogás
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: python scraper.py

      - name: Save the updated list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data LISTINGS.md docs
          git diff --cached --quiet || git commit -m "Update UniFi listings $(TZ=Europe/Budapest date '+%Y-%m-%d %H:%M')"
          git push
